test_metadata:
  description: >-
    Scylla Manager restore benchmark on a 6-node multi-DC cluster (3 nodes in us-east-1, 3 in us-west-2).
    Restores the 2TB TWCS pre-created snapshot 2tb_1t_twcs_2025_4_multidc using the native restore method,
    then runs a verification read with cassandra-stress.
  test_type: manager
  tier: ondemand
  duration_class: medium
  supported_backends:
    - aws
  stress_tools:
    - cassandra-stress
  features:
    - multi-dc
  team_ownership: scylladb/mgmt

test_duration: 720

# Snapshot DCs are us-east-1 and us-west-2, the restore maps each DC to the same name
region_name: 'us-east-1 us-west-2'
n_db_nodes: [3, 3]
n_loaders: [2, 2]
region_aware_loader: true
simulated_racks: 0

# Graviton nodes with 2x2.5TB NVMe, the snapshot takes ~2.3TB per node
instance_type_db: 'i8ge.2xlarge'
instance_type_loader: 'c6i.2xlarge'

client_encrypt: true

# Snapshot tag sm_20260224031828UTC, defined in defaults/manager_restore_benchmark_snapshots.yaml
mgmt_reuse_backup_snapshot_name: '2tb_1t_twcs_2025_4_multidc'
manager_backup_restore_method: 'native'

append_scylla_yaml:
  auto_snapshot: false
  object_storage_endpoints:
    - name: s3.{region}.amazonaws.com  # {region} is replaced with the backup bucket region
      port: 443
      https: true
      aws_region: "{region}"

post_behavior_db_nodes: "destroy"
post_behavior_loader_nodes: "destroy"
post_behavior_monitor_nodes: "destroy"

user_prefix: 'manager-restore-benchmark-multidc'
