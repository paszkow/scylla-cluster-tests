test_duration: 90

prepare_write_cmd:  "cassandra-stress write cl=QUORUM n=20971520 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3) compaction(strategy=SizeTieredCompactionStrategy)' -mode cql3 native -rate threads=80 -pop seq=1..20971520 -col 'n=FIXED(2) size=FIXED(5120)' -log interval=5"

stress_cmd: [
             "cassandra-stress write cl=QUORUM duration=60m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3) compaction(strategy=SizeTieredCompactionStrategy)' -mode cql3 native -rate threads=100 -pop seq=1..20971520 -col 'n=FIXED(2) size=FIXED(5120)' -log interval=5 ",
             "cassandra-stress read  cl=QUORUM duration=60m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3) compaction(strategy=SizeTieredCompactionStrategy)' -mode cql3 native -rate threads=100 -pop seq=1..20971520 -col 'n=FIXED(2) size=FIXED(5120)' -log interval=5 ",
             "cassandra-stress read  cl=QUORUM duration=60m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3) compaction(strategy=SizeTieredCompactionStrategy)' -mode cql3 native -rate threads=100 -pop seq=1..20971520 -col 'n=FIXED(2) size=FIXED(5120)' -log interval=5 ",
             "cassandra-stress read  cl=QUORUM duration=60m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3) compaction(strategy=SizeTieredCompactionStrategy)' -mode cql3 native -rate threads=100 -pop seq=1..20971520 -col 'n=FIXED(2) size=FIXED(5120)' -log interval=5 ",
             ]

n_db_nodes: 3
n_loaders: 4
seeds_num: 3

instance_type_db: 'i4i.xlarge'
instance_type_loader: 'c6i.4xlarge'

# nemesis_class_name: 'GrowShrinkClusterNemesis'
# nemesis_seed: '032'
# nemesis_interval: 10
# nemesis_filter_seeds: false

user_prefix: 'longevity-100gb-4h'
space_node_threshold: 64424

server_encrypt: true
client_encrypt: true

pre_create_schema: True
sstable_size: 100

hinted_handoff: 'enabled'
parallel_node_operations: true
# Every loader runs exactly one stress command
round_robin: true

stop_test_on_stress_failure: false
