append_scylla_yaml:
  auto_snapshot: false
  object_storage_endpoints:
    - name: s3.us-east-1.amazonaws.com
      port: 443
      https: true
      aws_region: us-east-1
  # Per-shard S3 connection budget, split between scheduling groups by shares (utils/s3/client.cc
  # rebalance_connections()). With the default 128, sl:default gets ~79 connections, or ~50 once another
  # group (e.g. gossip, after a tablet cleanup) has created an S3 client on the shard. At ~70 ms per GET
  # that caps a shard at ~700-1,100 GET/s and starves QUORUM reads (build .../tablets/42, node-3 shard 4).
  object_storage_connections_per_shard: 512

  # Webinar demo only. The REST API defaults to 127.0.0.1, so nodetool -h <other-node> and any curl
  # against another node's API are refused - which forces ssh into every step of the demo. Binding it
  # to the private network lets the whole demo run from one shell. Needs a restart, so it must be set
  # at provisioning time. Do not carry this into anything long-lived: it exposes the admin API to the
  # cluster's network.
  api_address: 0.0.0.0

# Disable the row cache on the stress table, so every read in the demo reaches S3.
#
# This has to live here rather than in the test case. post_prepare_cql_cmds is also set by
# configurations/disable_speculative_retry.yaml, and merging a list across config files replaces it
# unless the LATER file opts in with a '++' first element (sdcm/sct_config.py:266). This file is
# loaded last in the job's test_config, so '++' appends to whatever came before instead of discarding
# it. Without this the ALTER is silently dropped and the workload runs ~30% cache hits.
post_prepare_cql_cmds:
  - "++"
  - "ALTER TABLE keyspace1.standard1 WITH caching = {'enabled': 'false'}"

