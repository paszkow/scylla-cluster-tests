# ALTER TABLE command used by the compression-toggle reproducer
# (SCYLLADB-1214) to enable ZSTD dictionary compression mid-workload.
#
# Target table is scylla_bench.test because the reproducer uses
# scylla-bench with large partitions to trigger LSA compaction stalls.
#
# speculative_retry is disabled to match the perf-regression-predefined-
# throughput-steps-tablets baseline configuration.
# Owned by Storage QA
post_prepare_cql_cmds: >-
  ALTER TABLE scylla_bench.test
  WITH compression = {
    'sstable_compression': 'ZstdWithDictsCompressor'
  }
  AND speculative_retry = 'NONE';
